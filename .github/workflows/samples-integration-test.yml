name: Samples Build Check

on:
  pull_request:
    paths:
      - 'samples/**'
      - 'sdk_v2/**'
      - '.github/workflows/samples-integration-test.yml'
  push:
    paths:
      - 'samples/**'
      - 'sdk_v2/**'
      - '.github/workflows/samples-integration-test.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── C++ Samples ─────────────────────────────────────────────────────
  cpp-samples:
    runs-on: ${{ matrix.platform }}-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Setup .NET SDK for NuGet restore
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Restore C++ Runtime 2.2.1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force samples/cpp/build | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net9.0</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.AI.Foundry.Local.Runtime" Version="2.2.1" />
            </ItemGroup>
          </Project>
          '@ | Set-Content samples/cpp/build/Runtime.csproj
          dotnet restore samples/cpp/build/Runtime.csproj --packages samples/cpp/build/packages

      - name: Compile-check C++ samples
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem samples/cpp/*/main.cc | ForEach-Object {
            $name = $_.Directory.Name
            Write-Host "=== Checking: $name ==="
            clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror `
              '-Isamples/cpp/build/packages/microsoft.ai.foundry.local.runtime/2.2.1/build/native/include' `
              '-I.' -fsyntax-only $_.FullName
            if ($LASTEXITCODE -ne 0) {
              $failed += $name
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed compile checks: $($failed -join ', ')"
            exit 1
          }

  # ── Python Samples ──────────────────────────────────────────────────
  python-samples:
    runs-on: ${{ matrix.platform }}-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install sample dependencies
        shell: pwsh
        run: |
          Get-ChildItem samples/python/*/requirements.txt -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Installing dependencies for $($_.Directory.Name)..."
            Push-Location $_.Directory.FullName
            pip install -r requirements.txt
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            Pop-Location
          }

      - name: Syntax check Python samples
        shell: pwsh
        run: |
          $failed = @()
          $samples = Get-ChildItem samples/python/*/src/app.py -ErrorAction SilentlyContinue
          foreach ($sample in $samples) {
            $name = $sample.Directory.Parent.Name
            Write-Host "=== Checking: $name ==="
            python -m py_compile $sample.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAILED: $name"
              $failed += $name
            } else {
              Write-Host "OK: $name"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed syntax checks: $($failed -join ', ')"
            exit 1
          }

  # ── JavaScript Samples ──────────────────────────────────────────────
  js-samples:
    runs-on: ${{ matrix.platform }}-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.x'

      - name: Syntax check JS samples
        shell: pwsh
        run: |
          $failed = @()
          # Find all sample app.js files (either in root or src/)
          $samples = @()
          $samples += Get-ChildItem samples/js/*/app.js -ErrorAction SilentlyContinue
          $samples += Get-ChildItem samples/js/*/src/app.js -ErrorAction SilentlyContinue
          foreach ($sample in $samples) {
            $dir = if ($sample.Directory.Name -eq 'src') { $sample.Directory.Parent } else { $sample.Directory }
            $name = $dir.Name
            Write-Host "=== Checking: $name ==="
            Push-Location $dir.FullName
            npm install --ignore-scripts --package-lock=false
            $installExitCode = $LASTEXITCODE
            if ($installExitCode -eq 0) {
              npm run check
            }
            $checkExitCode = $LASTEXITCODE
            Pop-Location
            if ($installExitCode -ne 0 -or $checkExitCode -ne 0) {
              Write-Host "FAILED: $name"
              $failed += $name
            } else {
              Write-Host "OK: $name"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed syntax checks: $($failed -join ', ')"
            exit 1
          }

  # ── C# Samples ─────────────────────────────────────────────────────
  cs-samples:
    runs-on: ${{ matrix.platform }}-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            rid: win-x64
          - platform: macos
            rid: osx-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Build C# samples
        shell: pwsh
        run: |
          $failed = @()
          $projects = Get-ChildItem samples/cs -Recurse -Filter "*.csproj"
          foreach ($proj in $projects) {
            $name = $proj.BaseName
            Write-Host "`n=== Building: $name ==="
            dotnet restore $proj.FullName --runtime ${{ matrix.rid }} `
              --configfile samples/cs/nuget.config `
              -p:RuntimeIdentifiers=${{ matrix.rid }} 2>&1
            if ($LASTEXITCODE -eq 0) {
              dotnet build $proj.FullName --configuration Debug --no-restore `
                --runtime ${{ matrix.rid }} `
                -p:RuntimeIdentifiers=${{ matrix.rid }} 2>&1
            }
            if ($LASTEXITCODE -ne 0) {
              Write-Host "BUILD FAILED: $name"
              $failed += $name
            } else {
              Write-Host "BUILD PASSED: $name"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed builds: $($failed -join ', ')"
            exit 1
          }

  # ── Rust Samples ────────────────────────────────────────────────────
  rust-samples:
    runs-on: ${{ matrix.platform }}-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: samples/rust -> target

      - name: Build Rust samples workspace
        working-directory: samples/rust
        run: cargo build --workspace

      - name: Clippy check
        working-directory: samples/rust
        run: cargo clippy --workspace -- -D warnings
