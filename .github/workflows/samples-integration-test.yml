name: Samples Build Check

on:
  pull_request:
    paths:
      - 'samples/**'
      - 'sdk_v2/**'
      - '.github/workflows/samples-integration-test.yml'
  push:
    paths:
      - 'samples/**'
      - 'sdk_v2/**'
      - '.github/workflows/samples-integration-test.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Python Samples ──────────────────────────────────────────────────
  python-samples:
    runs-on: ${{ matrix.platform }}-latest
    env:
      PIP_NO_INPUT: '1'
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Configure pip for Azure Artifacts
        run: |
          pip config set global.index-url https://pkgs.dev.azure.com/aiinfra/PublicPackages/_packaging/ORT-Nightly/pypi/simple/
          pip config set global.extra-index-url https://pypi.org/simple/
          pip config set global.pre true

      - name: Configure SDK v2 source and install its dependencies
        shell: pwsh
        run: |
          # Sample import/syntax checks use SDK source; native wheels need the packaging pipeline's C++ artifacts.
          $source = (Resolve-Path sdk_v2/python/src).Path
          "PYTHONPATH=$source" >> $env:GITHUB_ENV
          $dependencies = @'
          import json
          import pathlib
          import tomllib

          metadata = tomllib.loads(pathlib.Path("sdk_v2/python/pyproject.toml").read_text(encoding="utf-8"))
          versions = json.loads(pathlib.Path("sdk_v2/deps_versions.json").read_text(encoding="utf-8"))
          for dependency in metadata["project"]["dependencies"]:
              dependency = dependency.replace(
                  "onnxruntime==0.0.0", "onnxruntime==" + versions["onnxruntime"]["version"]
              ).replace(
                  "onnxruntime-genai-core==0.0.0", "onnxruntime-genai-core==" + versions["onnxruntime-genai"]["version"]
              )
              print(dependency)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Reading SDK dependency manifests failed" }
          python -m pip install @dependencies
          if ($LASTEXITCODE -ne 0) { throw "Installing Python SDK dependencies failed" }

      - name: Import-check Python v2 APIs
        shell: pwsh
        run: |
          python -c "from foundry_local_sdk import AudioItem, AudioSession, BytesItem, CatalogType, ChatSession, EmbeddingsSession, FoundryLocalManager, ItemQueue, MessageItem, ModelInfoBuilder, Request, RequestOptions, SearchOptions, SpeechResultItem, SpeechSegmentItem, ToolChoice, ToolResultItem; print('Python v2 imports OK')"

      - name: Install sample dependencies
        shell: pwsh
        run: |
          Get-ChildItem samples/python/*/requirements.txt -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Installing dependencies for $($_.Directory.Name)..."
            # The SDK is supplied by PYTHONPATH, not a published package.
            $requirements = @(Get-Content $_.FullName | Where-Object {
              $_.Trim() -and $_ -notmatch '^\s*(#|foundry-local-sdk(?:[<>=!~;\s\[]|$))'
            })
            if ($requirements.Count -gt 0) {
              $manifest = Join-Path $env:RUNNER_TEMP "$($_.Directory.Name)-requirements.txt"
              $requirements | Set-Content $manifest
              python -m pip install -r $manifest
              if ($LASTEXITCODE -ne 0) { throw "Installing dependencies failed: $($_.Directory.Name)" }
            }
          }

      - name: Syntax check Python samples
        shell: pwsh
        run: |
          $failed = @()
          $samples = Get-ChildItem samples/python/*/src/app.py -ErrorAction SilentlyContinue
          foreach ($sample in $samples) {
            $name = $sample.Directory.Parent.Name
            Write-Host "=== Checking: $name ==="
            python -c "import ast, pathlib, sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig'), filename=sys.argv[1])" $sample.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAILED: $name"
              $failed += $name
            } else {
              Write-Host "OK: $name"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed syntax checks: $($failed -join ', ')"
            exit 1
          }

  # ── JavaScript Samples ──────────────────────────────────────────────
  js-samples:
    runs-on: ${{ matrix.platform }}-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.x'

      - name: Remove .npmrc (use public registry)
        working-directory: sdk_v2/js
        shell: pwsh
        run: |
          if (Test-Path .npmrc) { Remove-Item .npmrc -Force; Write-Host "Removed .npmrc" }

      - name: Build SDK v2 TypeScript from source
        working-directory: sdk_v2/js
        shell: pwsh
        run: |
          npm install --ignore-scripts --registry https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { throw "Installing JavaScript SDK dependencies failed" }
          npm run build:ts

      - name: Import-check JS v2 APIs
        shell: pwsh
        run: |
          node --input-type=module -e "const {pathToFileURL} = await import('node:url'); const {resolve} = await import('node:path'); const sdk = await import(pathToFileURL(resolve('sdk_v2/js/dist/index.js')).href); const names = ['AudioSession','ChatSession','EmbeddingsSession','FoundryLocalManager','Item','ItemQueue','ModelInfoBuilder','Request']; for (const name of names) { if (!(name in sdk)) throw new Error('Missing export: ' + name); } console.log('JS v2 imports OK');"

      - name: Syntax check JS samples
        shell: pwsh
        run: |
          $failed = @()
          foreach ($dir in Get-ChildItem samples/js -Directory) {
            $name = $dir.Name
            Write-Host "=== Checking: $name ==="
            # Install dependencies from each sample manifest; the manifest pins
            # foundry-local-sdk to the in-repo sdk_v2/js source via file: path.
            Push-Location $dir.FullName
            if (Test-Path "package.json") {
              npm install --ignore-scripts --registry https://registry.npmjs.org
              if ($LASTEXITCODE -ne 0) {
                Pop-Location
                throw "Dependency installation failed: $name"
              }
            }
            Pop-Location
            $files = Get-ChildItem $dir.FullName -Recurse -File -Filter "*.js" |
              Where-Object { $_.FullName -notmatch '[/\\](node_modules|dist|build)[/\\]' }
            foreach ($file in $files) {
              node --check $file.FullName
              if ($LASTEXITCODE -ne 0) {
                $failed += $file.FullName
              }
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed syntax checks: $($failed -join ', ')"
            exit 1
          }

  cpp-samples:
    runs-on: ${{ matrix.platform }}-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile C++ sample against SDK v2 headers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force sdk_v2/cpp/build | Out-Null
          if ($IsWindows) {
            $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vs) { throw "Visual C++ toolchain not found" }
            $vcvars = Join-Path $vs "VC/Auxiliary/Build/vcvars64.bat"
            & $env:ComSpec /c "call `"$vcvars`" && cl /nologo /std:c++20 /EHsc /W4 /WX /c /I sdk_v2/cpp/include /Fo:sdk_v2/cpp/build/sample-live-audio.obj samples/cpp/live-audio-transcription/main.cpp"
          } else {
            clang++ -std=c++20 -Wall -Wextra -Werror -fsyntax-only -I sdk_v2/cpp/include samples/cpp/live-audio-transcription/main.cpp
          }
          if ($LASTEXITCODE -ne 0) { throw "C++ sample compilation failed" }

  # ── C# Samples ─────────────────────────────────────────────────────
  cs-samples:
    runs-on: ${{ matrix.platform }}-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build C# samples
        shell: pwsh
        run: |
          $failed = @()
          $projects = Get-ChildItem samples/cs -Recurse -Filter "*.csproj"
          foreach ($proj in $projects) {
            $name = $proj.BaseName
            Write-Host "`n=== Building: $name ==="
            dotnet build $proj.FullName --configuration Debug -warnaserror:CS0618 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "BUILD FAILED: $name"
              $failed += $name
            } else {
              Write-Host "BUILD PASSED: $name"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed builds: $($failed -join ', ')"
            exit 1
          }

  # ── Rust Samples ────────────────────────────────────────────────────
  rust-samples:
    runs-on: ${{ matrix.platform }}-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: samples/rust -> target

      - name: Use crates.io directly
        shell: pwsh
        run: |
          # Remove crates-io redirect in SDK (points to Azure Artifacts)
          $configPath = "sdk_v2/rust/.cargo/config.toml"
          if (Test-Path $configPath) {
            Remove-Item $configPath
            Write-Host "Removed sdk_v2/rust/.cargo/config.toml"
          }
          # Remove crates-io redirect in samples
          $configPath = "samples/rust/.cargo/config.toml"
          if (Test-Path $configPath) {
            Remove-Item $configPath
            Write-Host "Removed samples/rust/.cargo/config.toml"
          }

      - name: Build Rust samples workspace
        working-directory: samples/rust
        run: cargo build --workspace

      - name: Clippy check
        working-directory: samples/rust
        run: cargo clippy --workspace -- -D warnings
