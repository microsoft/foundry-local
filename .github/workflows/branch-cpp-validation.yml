name: Branch C++ validation

on:
  push:
    branches:
      - feature/chat-template-kwargs

env:
  ORT_BUILD_VERSION: "1.26.0"
  ORT_RUNTIME_VERSION: "1.28.0"
  ORT_BUILD_SOURCE: "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/ORT-Nightly/nuget/v3/index.json"
  ORT_RUNTIME_SOURCE: "https://api.nuget.org/v3/index.json"
  ORT_PACKAGE_NAME: "Microsoft.ML.OnnxRuntime"

jobs:
  stacked-cpp-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out stacked ORT GenAI
        uses: actions/checkout@v4
        with:
          repository: jennyf19/onnxruntime-genai
          ref: 6efc228895d5dbf20f5429f7843d5fc38075e8f0
          path: ortgenai
      - name: Point stacked build at ORT Extensions PR
        run: |
          sed -i \
            's#onnxruntime_extensions;https://github.com/microsoft/onnxruntime-extensions.git;[^[:space:]]*#onnxruntime_extensions;https://github.com/jennyf19/onnxruntime-extensions.git;338dc42ed2f30bcb417925010f8f721b0621a14c#' \
            ortgenai/cmake/deps.txt
      - name: Download ONNX Runtime
        working-directory: ortgenai
        run: |
          dotnet new console
          dotnet add package "$ORT_PACKAGE_NAME" --version "$ORT_BUILD_VERSION" --source "$ORT_BUILD_SOURCE" --package-directory .
          dotnet add package "$ORT_PACKAGE_NAME" --version "$ORT_RUNTIME_VERSION" --source "$ORT_RUNTIME_SOURCE" --package-directory .
          mkdir -p ort-build/lib ort/lib
          mv "microsoft.ml.onnxruntime/$ORT_BUILD_VERSION/build/native/include" ort-build/
          mv "microsoft.ml.onnxruntime/$ORT_BUILD_VERSION/runtimes/linux-x64/native/"* ort-build/lib/
          mv "microsoft.ml.onnxruntime/$ORT_RUNTIME_VERSION/runtimes/linux-x64/native/"* ort/lib/
          cp ort-build/lib/libonnxruntime.so ort-build/lib/libonnxruntime.so.1
          cp ort/lib/libonnxruntime.so ort/lib/libonnxruntime.so.1
      - name: Build stacked ORT GenAI
        working-directory: ortgenai
        run: |
          python -m pip install -r requirements-dev.txt
          CC=gcc CXX=g++ python build.py \
            --config Release \
            --build_dir build/Linux \
            --cmake_generator Ninja \
            --ort_home "$GITHUB_WORKSPACE/ortgenai/ort-build" \
            --use_guidance \
            --update --build \
            --skip_examples
      - name: Set up vcpkg
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          # Need full commit/tree history for Foundry's older builtin-baseline +
          # versioned port trees, but not every historical blob. blob:none keeps
          # history while avoiding multi-GB full clones that hang runners.
          git clone --filter=blob:none --single-branch https://github.com/microsoft/vcpkg.git vcpkg
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Build Foundry Local tests
        run: |
          python sdk_v2/cpp/build.py \
            --config Release \
            --cmake_generator Ninja \
            --vcpkg_root "$GITHUB_WORKSPACE/vcpkg" \
            --ort_home "$GITHUB_WORKSPACE/ortgenai/ort-build" \
            --ort_genai_home "$GITHUB_WORKSPACE/ortgenai" \
            --skip_service \
            --configure --build --skip_tests --parallel
      - name: Run affected Foundry tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ortgenai/ort/lib:${{ github.workspace }}/ortgenai/build/Linux/Release
        run: |
          sdk_v2/cpp/build/Linux/Release/bin/foundry_local_tests \
            --gtest_filter='ChatCompletionRequestTest.*:ChatCompletionsConverterTest.*'