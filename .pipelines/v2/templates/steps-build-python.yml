# Inner steps to build one platform's Foundry Local Python SDK wheel.
#
# The caller is responsible for:
#   * placing the platform-native binaries (foundry_local.{dll,so,dylib}
#     and any sibling runtime DLLs) under `nativeArtifactDir`
#   * downloading the `version-info` pipeline artifact so this template
#     can read $(Pipeline.Workspace)/version-info/pyVersion.txt
#
# The wheel is per-platform — each pipeline job produces exactly one wheel
# containing one platform's native lib at
# src/foundry_local_sdk/_native/<rid>/.

parameters:
- name: nativeArtifactDir
  type: string
  displayName: 'Path to the downloaded cpp-native-<rid> artifact directory'
- name: rid
  type: string
  displayName: 'Runtime identifier (win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64)'
- name: outputDir
  type: string
  default: '$(Build.ArtifactStagingDirectory)/python-sdk'
  displayName: 'Path to directory for the built wheel'
- name: pythonArchitecture
  type: string
  default: 'x64'
  values: ['x64', 'arm64']
  displayName: 'Architecture of the host Python interpreter (matches the agent OS arch).'
- name: useSystemPython
  type: boolean
  default: false
  displayName: 'Use the agent system Python instead of the Azure Pipelines toolcache.'

steps:

- ${{ if eq(parameters.useSystemPython, false) }}:
  - task: UsePythonVersion@0
    displayName: 'Use Python 3.12'
    inputs:
      versionSpec: '3.12'
      addToPath: true
      architecture: '${{ parameters.pythonArchitecture }}'

- ${{ if eq(parameters.useSystemPython, true) }}:
  - task: PowerShell@2
    displayName: 'Configure system Python 3.12'
    inputs:
      targetType: inline
      pwsh: true
      script: |
        python3 --version
        python3 -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

        $venvDir = "$(Agent.TempDirectory)/fl-py-build-$(System.JobId)"
        if (Test-Path $venvDir) { Remove-Item -Recurse -Force $venvDir }
        python3 -m venv $venvDir
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $venvBin = Join-Path $venvDir 'bin'
        Write-Host "##vso[task.prependpath]$venvBin"
        Write-Host "Using system Python through build venv: $venvDir"

- task: PowerShell@2
  displayName: 'Set package version from pyVersion.txt'
  inputs:
    targetType: inline
    pwsh: ${{ ne(parameters.rid, 'win-arm64') }}
    script: |
        $versionFile = "$(Pipeline.Workspace)/version-info/pyVersion.txt"
        if (-not (Test-Path $versionFile)) { throw "Missing $versionFile" }
        $v = (Get-Content $versionFile -Raw).Trim()
        Write-Host "Package version: $v"
        Write-Host "##vso[task.setvariable variable=packageVersion]$v"

- task: PowerShell@2
  displayName: 'Stamp version into pyproject.toml'
  inputs:
    targetType: inline
    pwsh: ${{ ne(parameters.rid, 'win-arm64') }}
    script: |
        $pyproject = "$(Build.SourcesDirectory)/sdk_v2/python/pyproject.toml"
        $content = Get-Content $pyproject -Raw
        # Replace the first occurrence of `version = "..."` inside the
        # [project] table. The backend shim handles the package-name
        # patch; here we only stamp the version.
        $patched = [regex]::Replace(
            $content,
            '(?m)^version\s*=\s*"[^"]*"',
            'version = "' + "$(packageVersion)" + '"',
            [System.Text.RegularExpressions.RegexOptions]::None,
            [TimeSpan]::FromSeconds(5))
        if ($patched -eq $content) { throw "Could not stamp version into $pyproject" }
        Set-Content -Path $pyproject -Value $patched -NoNewline
        Write-Host "Stamped version $(packageVersion) into pyproject.toml"

- task: PowerShell@2
  displayName: 'List downloaded native artifact'
  inputs:
    targetType: inline
    pwsh: ${{ ne(parameters.rid, 'win-arm64') }}
    script: |
        Write-Host "Contents of ${{ parameters.nativeArtifactDir }}:"
        Get-ChildItem "${{ parameters.nativeArtifactDir }}" -Recurse -File |
            ForEach-Object { Write-Host ("{0,12}  {1}" -f $_.Length, $_.FullName) }

- task: PowerShell@2
  displayName: 'Stage native lib into _native/${{ parameters.rid }}/'
  inputs:
    targetType: inline
    pwsh: ${{ ne(parameters.rid, 'win-arm64') }}
    script: |
        $dest = "$(Build.SourcesDirectory)/sdk_v2/python/src/foundry_local_sdk/_native/${{ parameters.rid }}"
        if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
        New-Item -ItemType Directory -Force -Path $dest | Out-Null

        # The native artifact is produced by steps-build-{windows,linux,macos}.yml.
        # C++ bundles consume its co-located ORT/GenAI libraries, but Python gets
        # those libraries from pip dependencies, so filter them out here. The
        # remaining files are the primary foundry_local library plus (on Windows)
        # its .pdb, .lib, and optional WinML companions:
        #   - Windows:  foundry_local.{dll,pdb,lib}
        #   - Linux:    libfoundry_local.so
        #   - macOS:    libfoundry_local.dylib
        $files = Get-ChildItem -Path "${{ parameters.nativeArtifactDir }}" -Recurse -File |
            Where-Object { $_.Name -notlike 'onnxruntime*' -and $_.Name -notlike 'libonnxruntime*' }
        if ($files.Count -eq 0) {
            throw "No native artifacts found under ${{ parameters.nativeArtifactDir }}"
        }
        foreach ($f in $files) {
            Copy-Item $f.FullName -Destination $dest -Force
        }
        Write-Host "Copied $($files.Count) native file(s) to $dest"
        Get-ChildItem $dest | ForEach-Object { Write-Host "  $($_.Name)" }

# lib_loader.py preloads the pip-installed ORT and GenAI libraries, so no
# patchelf or install_name_tool fixup is needed.

- task: PowerShell@2
  displayName: 'Clean stale build artifacts'
  inputs:
    targetType: inline
    pwsh: ${{ ne(parameters.rid, 'win-arm64') }}
    script: |
        $py = "$(Build.SourcesDirectory)/sdk_v2/python"
        # Remove stale, untagged cffi extension from prior dev compiles.
        # The wheel build below produces a properly ABI-tagged variant; the
        # untagged copy is bonus baggage we don't want shipped.
        $stale = "$py/src/foundry_local_sdk/_native/_cffi_bindings.pyd",
                 "$py/src/foundry_local_sdk/_native/_cffi_bindings.so",
                 "$py/src/foundry_local_sdk/_native/_cffi_bindings.dylib"
        foreach ($p in $stale) {
            if (Test-Path $p) {
                Remove-Item -Force $p
                Write-Host "Removed $p"
            }
        }
        foreach ($dir in @("$py/build", "$py/dist", "$py/src/foundry_local_sdk.egg-info")) {
            if (Test-Path $dir) {
                Remove-Item -Recurse -Force $dir
                Write-Host "Removed $dir"
            }
        }

- task: PowerShell@2
  displayName: 'Install build tooling'
  inputs:
    targetType: inline
    pwsh: ${{ ne(parameters.rid, 'win-arm64') }}
    script: |
        python -m pip install --upgrade pip
        $buildTools = @('build', 'setuptools', 'wheel', 'cffi>=1.16')
        if ('${{ parameters.rid }}' -like 'linux-*') {
            $buildTools += 'auditwheel>=6.8'
        }
        python -m pip install --upgrade @buildTools
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

- ${{ if eq(parameters.rid, 'win-arm64') }}:
  - task: PowerShell@2
    displayName: 'Ensure Visual Studio Build Tools for Windows ARM64 Python build'
    inputs:
      targetType: inline
      pwsh: false
      script: |
          $installRoot = 'C:\BuildTools'
          $vcvars = Join-Path $installRoot 'VC\Auxiliary\Build\vcvarsall.bat'

          if (-not (Test-Path $vcvars)) {
              Write-Host 'Visual Studio Build Tools not fully present. Installing...'
              $bootstrapper = Join-Path $env:TEMP 'vs_BuildTools.exe'
              Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vs_BuildTools.exe' -OutFile $bootstrapper -UseBasicParsing

              $arguments = @(
                  '--quiet',
                  '--wait',
                  '--norestart',
                  '--nocache',
                  '--installPath', $installRoot,
                  '--add', 'Microsoft.VisualStudio.Workload.VCTools',
                  '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64',
                  '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
                  '--add', 'Microsoft.VisualStudio.Component.Windows11SDK.22621',
                  '--includeRecommended'
              )

              $process = Start-Process -FilePath $bootstrapper -ArgumentList $arguments -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                  throw "Visual Studio Build Tools install failed with exit code $($process.ExitCode)."
              }
          }

          if (-not (Test-Path $vcvars)) {
              throw "vcvarsall.bat was not found at $vcvars after Build Tools install."
          }

          Write-Host "vcvarsall.bat: $vcvars"
          Write-Host "##vso[task.setvariable variable=vcvarsAllPath]$vcvars"

- task: PowerShell@2
  displayName: 'Build wheel'
  inputs:
    targetType: inline
    pwsh: ${{ ne(parameters.rid, 'win-arm64') }}
    script: |
        $outDir = "${{ parameters.outputDir }}"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null
        $extraArgs = @()
        $platformTag = switch ('${{ parameters.rid }}') {
            'linux-x64'   { 'manylinux_2_28_x86_64' }
            'linux-arm64' { 'manylinux_2_28_aarch64' }
            'osx-arm64'   { 'macosx_11_0_arm64' }
            default       { $null }
        }
        if ($platformTag) {
            $extraArgs += "--config-setting=--build-option=--plat-name=$platformTag"
            Write-Host "Forcing wheel plat tag $platformTag"
        }
        Push-Location "$(Build.SourcesDirectory)/sdk_v2/python"
        try {
        if ('${{ parameters.rid }}' -eq 'win-arm64') {
                $vcvars = "$(vcvarsAllPath)"
                if (-not $vcvars) { throw "vcvarsAllPath pipeline variable is empty" }
                $buildArgs = @('-m', 'build', '--wheel', '--outdir', $outDir) + $extraArgs
                $quoted = ($buildArgs | ForEach-Object { '"' + $_ + '"' }) -join ' '
                $cmdLine = ('"{0}" arm64 && set DISTUTILS_USE_SDK=1 && set MSSdk=1 && python {1}' -f $vcvars, $quoted)
                Write-Host "cmd /c $cmdLine"
                cmd /c $cmdLine
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } else {
                python -m build --wheel --outdir $outDir @extraArgs
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
        } finally {
            Pop-Location
        }

- ${{ if startsWith(parameters.rid, 'linux-') }}:
  - task: PowerShell@2
    displayName: 'Validate manylinux compatibility'
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $ErrorActionPreference = 'Stop'
        $wheels = @(Get-ChildItem "${{ parameters.outputDir }}" -Filter '*.whl')
        if ($wheels.Count -ne 1) {
            throw "Expected exactly one .whl under ${{ parameters.outputDir }}, found $($wheels.Count)"
        }

        $json = (& auditwheel show --json $wheels[0].FullName) -join "`n"
        if ($LASTEXITCODE -ne 0) {
            throw "auditwheel failed with exit code $LASTEXITCODE"
        }
        $report = $json | ConvertFrom-Json
        Write-Host "auditwheel platform: $($report.overall_tag)"

        if ($report.overall_tag -notmatch '^manylinux_(\d+)_(\d+)_(x86_64|aarch64)$') {
            throw "Wheel is not manylinux compatible: $($report.overall_tag)"
        }

        $expectedArchitecture = if ('${{ parameters.rid }}' -eq 'linux-arm64') { 'aarch64' } else { 'x86_64' }
        if ($Matches[3] -ne $expectedArchitecture) {
            throw "Wheel architecture is $($Matches[3]); expected $expectedArchitecture"
        }

        $requiredPolicy = [version]"$($Matches[1]).$($Matches[2])"
        if ($requiredPolicy -gt [version]'2.28') {
            throw "Wheel requires $($report.overall_tag), which exceeds the manylinux_2_28 target"
        }

- task: PowerShell@2
  displayName: 'List produced wheel'
  inputs:
    targetType: inline
    pwsh: ${{ ne(parameters.rid, 'win-arm64') }}
    script: |
        Get-ChildItem "${{ parameters.outputDir }}" -Filter '*.whl' |
            ForEach-Object { Write-Host ("{0,12}  {1}" -f $_.Length, $_.Name) }

# Assert every build stage produced the expected platform-specific wheel.
- task: PowerShell@2
  displayName: 'Assert wheel platform tag and bundled native lib'
  inputs:
    targetType: inline
    pwsh: ${{ ne(parameters.rid, 'win-arm64') }}
    script: |
        $ErrorActionPreference = 'Stop'
        switch ('${{ parameters.rid }}') {
            'win-x64'     { $tags = @('win_amd64');                 $lib = 'foundry_local.dll' }
            'win-arm64'   { $tags = @('win_arm64');                 $lib = 'foundry_local.dll' }
            'linux-x64'   { $tags = @('manylinux_2_28_x86_64');     $lib = 'libfoundry_local.so' }
            'linux-arm64' { $tags = @('manylinux_2_28_aarch64');    $lib = 'libfoundry_local.so' }
            'osx-arm64'   { $tags = @('macosx', 'arm64');           $lib = 'libfoundry_local.dylib' }
            default       { throw "Unknown rid: ${{ parameters.rid }}" }
        }

        $wheels = @(Get-ChildItem "${{ parameters.outputDir }}" -Filter '*.whl')
        if ($wheels.Count -ne 1) {
            throw "Expected exactly one .whl under ${{ parameters.outputDir }}, found $($wheels.Count)"
        }

        $whl = $wheels[0]
        Write-Host "Wheel: $($whl.Name)"

        foreach ($tag in $tags) {
            if ($whl.Name -notlike "*$tag*") {
                throw "Expected platform tag '$tag' in wheel name: $($whl.Name)"
            }
        }

        $expected = "_native/${{ parameters.rid }}/$lib"
        $code = @'
        import sys, zipfile

        whl, expected = sys.argv[1], sys.argv[2]
        with zipfile.ZipFile(whl) as wheel:
            names = wheel.namelist()

        hits = [name for name in names if name.endswith(expected)]
        if not hits:
            print("ERROR: " + expected + " not found in wheel")
            for name in names:
                if name.endswith((".so", ".dll", ".dylib")):
                    print("  " + name)
            sys.exit(1)

        print("OK: found " + hits[0])
        '@
        $code | python - "$($whl.FullName)" "$expected"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Write-Host "Wheel validation passed."
