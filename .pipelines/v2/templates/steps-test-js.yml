# Inner steps to run the JS SDK vitest suite against a prebuilt addon.
#
# The caller is responsible for placing the `js-prebuild-<rid>` artifact at
# `prebuildArtifactDir`. We drop its contents into sdk_v2/js/prebuilds/<plat>-<arch>/
# so the runtime addon-loader in dist/native/load.js finds it, then run vitest.

parameters:
- name: rid
  type: string
  values: ['win-x64', 'win-arm64', 'linux-x64', 'linux-arm64', 'osx-arm64']
  displayName: 'ADO RID for the platform being tested (no cross-arch testing)'
- name: prebuildArtifactDir
  type: string
  displayName: 'Path to the downloaded js-prebuild-<rid> artifact directory (root with prebuilds/ inside)'
- name: testDataSharedDir
  type: string
  displayName: 'Path to the model cache directory used by tests'

steps:

- task: NodeTool@0
  displayName: 'Use Node.js 20'
  inputs:
    versionSpec: '20.x'

- ${{ if or(eq(parameters.rid, 'win-x64'), eq(parameters.rid, 'win-arm64')) }}:
  - task: PowerShell@2
    displayName: 'Drop prebuild into sdk_v2/js/prebuilds'
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $src = "${{ parameters.prebuildArtifactDir }}/prebuilds"
        $dst = "$(Build.SourcesDirectory)/sdk_v2/js/prebuilds"
        if (-not (Test-Path $src)) { throw "Prebuild artifact missing: $src" }
        if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
        New-Item -ItemType Directory -Force -Path $dst | Out-Null
        Copy-Item "$src/*" -Destination $dst -Recurse -Force
        Get-ChildItem -Recurse $dst | ForEach-Object { Write-Host "  $($_.FullName)" }

- ${{ if or(eq(parameters.rid, 'linux-x64'), eq(parameters.rid, 'linux-arm64'), eq(parameters.rid, 'osx-arm64')) }}:
  - bash: |
      set -euo pipefail
      src="${{ parameters.prebuildArtifactDir }}/prebuilds"
      dst="$(Build.SourcesDirectory)/sdk_v2/js/prebuilds"
      if [ ! -d "$src" ]; then echo "Prebuild artifact missing: $src" >&2; exit 1; fi
      rm -rf "$dst"
      mkdir -p "$dst"
      cp -RP "$src/." "$dst/"
      find "$dst" -maxdepth 3 -print
    displayName: 'Drop prebuild into sdk_v2/js/prebuilds'

- ${{ if or(eq(parameters.rid, 'win-x64'), eq(parameters.rid, 'win-arm64')) }}:
  - task: PowerShell@2
    displayName: 'Bootstrap VC++ ARM64 runtime'
    condition: and(succeeded(), eq('${{ parameters.rid }}', 'win-arm64'))
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $ErrorActionPreference = 'Stop'
        $url = 'https://aka.ms/vs/17/release/vc_redist.arm64.exe'
        $installer = Join-Path $env:TEMP 'vc_redist.arm64.exe'
        $logPath = Join-Path $env:TEMP 'vc_redist_arm64_install.log'

        Write-Host "Downloading ARM64 VC++ runtime from: $url"
        Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing

        $arguments = @('/install', '/quiet', '/norestart', '/log', $logPath)
        $proc = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
        if ($proc.ExitCode -notin @(0, 3010, 1638)) {
          throw "VC++ ARM64 runtime installer failed with exit code $($proc.ExitCode). Log: $logPath"
        }

        if ($proc.ExitCode -eq 3010) {
          Write-Host 'VC++ ARM64 runtime installed; reboot is required by installer but deferred in CI.'
        } elseif ($proc.ExitCode -eq 1638) {
          Write-Host 'A newer/same VC++ ARM64 runtime is already installed.'
        } else {
          Write-Host 'VC++ ARM64 runtime installation completed successfully.'
        }

        $runtimeDlls = @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')
        foreach ($dll in $runtimeDlls) {
          $path = Join-Path "$env:WINDIR\System32" $dll
          if (-not (Test-Path $path)) {
            throw "Expected ARM64 VC runtime DLL not found: $path"
          }
          $ver = (Get-Item $path).VersionInfo.FileVersion
          Write-Host "  $dll => $path (version: $ver)"
        }

  - task: Npm@1
    displayName: 'npm ci (runs install-native postinstall)'
    inputs:
      command: custom
      workingDir: '$(Build.SourcesDirectory)/sdk_v2/js'
      customCommand: 'ci --no-audit --no-fund'

  - task: PowerShell@2
    displayName: 'Build TypeScript'
    inputs:
      targetType: inline
      pwsh: true
      script: |
        Set-Location "$(Build.SourcesDirectory)/sdk_v2/js"
        npm run build:ts
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  - task: PowerShell@2
    displayName: 'Run vitest'
    inputs:
      targetType: inline
      pwsh: true
      script: |
        Set-Location "$(Build.SourcesDirectory)/sdk_v2/js"
        Write-Host "FOUNDRY_TEST_DATA_DIR=$env:FOUNDRY_TEST_DATA_DIR"
        if (-not (Test-Path $env:FOUNDRY_TEST_DATA_DIR)) { throw "FOUNDRY_TEST_DATA_DIR does not exist: $env:FOUNDRY_TEST_DATA_DIR" }
        Get-ChildItem -Path $env:FOUNDRY_TEST_DATA_DIR -Force | ForEach-Object { Write-Host "  $($_.FullName)" }
        npx --no-install vitest run --reporter=verbose
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    env:
      FOUNDRY_TEST_DATA_DIR: '${{ parameters.testDataSharedDir }}'

- ${{ if or(eq(parameters.rid, 'linux-x64'), eq(parameters.rid, 'linux-arm64'), eq(parameters.rid, 'osx-arm64')) }}:
  - bash: |
      set -euo pipefail
      cd "$(Build.SourcesDirectory)/sdk_v2/js"
      npm ci --no-audit --no-fund
    displayName: 'npm ci (runs install-native postinstall)'

  - bash: |
      set -euo pipefail
      cd "$(Build.SourcesDirectory)/sdk_v2/js"
      npm run build:ts
    displayName: 'Build TypeScript'

  - bash: |
      set -euo pipefail
      cd "$(Build.SourcesDirectory)/sdk_v2/js"
      echo "FOUNDRY_TEST_DATA_DIR=${FOUNDRY_TEST_DATA_DIR}"
      test -d "${FOUNDRY_TEST_DATA_DIR}"
      ls -la "${FOUNDRY_TEST_DATA_DIR}"
      npx --no-install vitest run --reporter=verbose
    displayName: 'Run vitest'
    env:
      FOUNDRY_TEST_DATA_DIR: '${{ parameters.testDataSharedDir }}'
