# Inner steps to install a built Foundry Local Python SDK wheel into a
# clean venv and run the test suite.
#
# The caller is responsible for:
#   * placing the built wheel (.whl) under `wheelDir`
#   * populating the model cache directory at `testDataSharedDir`

parameters:
- name: wheelDir
  type: string
  displayName: 'Path to directory containing the built foundry_local_sdk wheel'
- name: testDataSharedDir
  type: string
  displayName: 'Absolute path to a checked-out test-data-shared working tree'
- name: pythonArchitecture
  type: string
  default: 'x64'
  values: ['x64', 'arm64']
  displayName: 'Architecture of the host Python interpreter (matches the agent OS arch).'
- name: usePwsh
  type: boolean
  default: true
  displayName: 'Use PowerShell Core (pwsh). Set false to use Windows PowerShell.'

steps:

- task: UsePythonVersion@0
  displayName: 'Use Python 3.12'
  inputs:
    versionSpec: '3.12'
    addToPath: true
    architecture: '${{ parameters.pythonArchitecture }}'

# Job-local venv so installs never pollute the agent's site-packages.
- task: PowerShell@2
  displayName: 'Create test venv'
  inputs:
    targetType: inline
    pwsh: ${{ parameters.usePwsh }}
    script: |
        $venvDir = "$(Agent.TempDirectory)/fl-py-venv-$(System.JobId)"
        if (Test-Path $venvDir) { Remove-Item -Recurse -Force $venvDir }
        python -m venv $venvDir
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if ($IsWindows -or $env:OS -eq 'Windows_NT') {
            $venvPy = Join-Path $venvDir 'Scripts/python.exe'
        } else {
            $venvPy = Join-Path $venvDir 'bin/python'
        }
        if (-not (Test-Path $venvPy)) { throw "venv python not found at $venvPy" }
        Write-Host "##vso[task.setvariable variable=venvPy]$venvPy"
        Write-Host "venv python: $venvPy"

- task: PowerShell@2
  displayName: 'Install built wheel + test deps'
  inputs:
    targetType: inline
    pwsh: ${{ parameters.usePwsh }}
    script: |
        # Locate the wheel. Each job's wheel lands in its own artifact, so a
        # single match is expected.
        $wheels = @(Get-ChildItem "${{ parameters.wheelDir }}" -Recurse -Filter '*.whl')
        if ($wheels.Count -eq 0) { throw "No .whl found under ${{ parameters.wheelDir }}" }
        if ($wheels.Count -gt 1) {
            Write-Host "Multiple wheels found:"
            $wheels | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "Expected exactly one wheel in ${{ parameters.wheelDir }}"
        }
        $wheel = $wheels[0].FullName
        Write-Host "Installing wheel: $wheel"

        & "$(venvPy)" -m pip install --upgrade pip
        & "$(venvPy)" -m pip install $wheel
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & "$(venvPy)" -m pip install pytest pytest-cov
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

- task: PowerShell@2
  displayName: 'ARM64 native loader diagnostics (Python)'
  condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'), eq(variables['Agent.OSArchitecture'], 'ARM64'))
  inputs:
    targetType: inline
    pwsh: ${{ parameters.usePwsh }}
    script: |
        $ErrorActionPreference = 'Continue'
        Write-Host "Agent.OS=$env:AGENT_OS"
        Write-Host "Agent.OSArchitecture=$env:AGENT_OSARCHITECTURE"
        Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"

        $dumpbin = (Get-Command dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source
        $linkExe = (Get-Command link.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source

        function Show-DllDiagnostics([string]$dllPath) {
          if (-not (Test-Path $dllPath)) {
            Write-Warning "Missing target DLL: $dllPath"
            return
          }

          Write-Host ""
          Write-Host "=== Diagnostics for $dllPath ==="
          $output = @()
          if ($dumpbin) {
            $output = & $dumpbin /dependents $dllPath 2>&1
          } elseif ($linkExe) {
            $output = & $linkExe /dump /dependents $dllPath 2>&1
          } else {
            Write-Warning 'Neither dumpbin.exe nor link.exe found on PATH.'
          }

          if ($output.Count -gt 0) {
            $output | ForEach-Object { Write-Host $_ }
            $deps = @($output |
              ForEach-Object {
                $line = $_.ToString().Trim()
                if ($line -match '^[A-Za-z0-9._-]+\\.dll$') { $line.ToLowerInvariant() }
              } |
              Where-Object { $_ } |
              Select-Object -Unique)

            $probeDirs = @(
              (Split-Path -Parent $dllPath),
              "$env:WINDIR\\System32",
              "$env:WINDIR\\SysWOW64"
            )
            foreach ($dep in $deps) {
              $resolved = $null
              foreach ($d in $probeDirs) {
                $p = Join-Path $d $dep
                if (Test-Path $p) { $resolved = $p; break }
              }
              if ($resolved) {
                Write-Host "  resolved: $dep -> $resolved"
              } else {
                Write-Warning "  unresolved: $dep"
              }
            }
          }
        }

        $wheelNativeDir = & "$(venvPy)" -c "import pathlib,foundry_local_sdk._native.lib_loader as l; print((pathlib.Path(l.__file__).resolve().parent / 'win-arm64'))"
        $wheelNativeDir = $wheelNativeDir.Trim()
        Write-Host "Wheel native dir: $wheelNativeDir"
        if (Test-Path $wheelNativeDir) {
            Get-ChildItem -Path $wheelNativeDir -Force | ForEach-Object { Write-Host "  $($_.Name)" }
        }

        $ortDll = & "$(venvPy)" -c "import importlib.util,pathlib; s=importlib.util.find_spec('onnxruntime_core'); print((pathlib.Path(s.origin).resolve().parent / 'bin' / 'onnxruntime.dll') if s else '')"
        $genaiDll = & "$(venvPy)" -c "import importlib.util,pathlib; s=importlib.util.find_spec('onnxruntime_genai_core'); print((pathlib.Path(s.origin).resolve().parent / 'bin' / 'onnxruntime-genai.dll') if s else '')"

        Show-DllDiagnostics (Join-Path $wheelNativeDir 'foundry_local.dll')
        if ($ortDll) { Show-DllDiagnostics $ortDll.Trim() }
        if ($genaiDll) { Show-DllDiagnostics $genaiDll.Trim() }

- task: PowerShell@2
  displayName: 'Run SDK tests'
  inputs:
    targetType: inline
    pwsh: ${{ parameters.usePwsh }}
    script: |
        Push-Location "$(Build.SourcesDirectory)/sdk_v2/python"
        try {
            # Override pythonpath = ["src"] from pyproject.toml so pytest
            # imports the installed wheel (which contains the compiled cffi
            # extension) rather than the un-built source tree (which does not).
            # The src/ entry is a local-dev convenience; in CI we want to
            # exercise exactly what we shipped.
            & "$(venvPy)" -m pytest test/ -v --override-ini=pythonpath=
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } finally {
            Pop-Location
        }
  env:
    TF_BUILD: 'true'
    FOUNDRY_TEST_DATA_DIR: ${{ parameters.testDataSharedDir }}
