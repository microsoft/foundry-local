# Inner steps to install a built Foundry Local Python SDK wheel into a
# clean venv and run the test suite.
#
# The caller is responsible for:
#   * placing the built wheel (.whl) under `wheelDir`
#   * populating the model cache directory at `testDataSharedDir`

parameters:
- name: wheelDir
  type: string
  displayName: 'Path to directory containing the built foundry_local_sdk wheel'
- name: testDataSharedDir
  type: string
  displayName: 'Absolute path to a checked-out test-data-shared working tree'
- name: pythonArchitecture
  type: string
  default: 'x64'
  values: ['x64', 'arm64']
  displayName: 'Architecture of the host Python interpreter (matches the agent OS arch).'
- name: useSystemPython
  type: boolean
  default: false
  displayName: 'Use the agent system Python instead of the Azure Pipelines toolcache.'

steps:

- ${{ if eq(parameters.useSystemPython, false) }}:
  - task: UsePythonVersion@0
    displayName: 'Use Python 3.12'
    inputs:
      versionSpec: '3.12'
      addToPath: true
      architecture: '${{ parameters.pythonArchitecture }}'

- ${{ if eq(parameters.useSystemPython, true) }}:
  - task: PowerShell@2
    displayName: 'Configure system Python 3.12'
    inputs:
      targetType: inline
      pwsh: true
      script: |
        python3 --version
        python3 -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

        $userBase = & python3 -c "import site; print(site.USER_BASE)"
        $userBin = Join-Path $userBase 'bin'
        New-Item -ItemType Directory -Force -Path $userBin | Out-Null
        $python3Path = (& which python3).Trim()
        & ln -sf $python3Path (Join-Path $userBin 'python')

        Write-Host "##vso[task.prependpath]$userBin"
        Write-Host "Using system Python: $python3Path"

- task: PowerShell@2
  displayName: 'Bootstrap VC++ ARM64 runtime'
  condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'), eq(variables['Agent.OSArchitecture'], 'ARM64'))
  inputs:
    targetType: inline
    pwsh: true
    script: |
      $ErrorActionPreference = 'Stop'
      $url = 'https://aka.ms/vs/17/release/vc_redist.arm64.exe'
      $installer = Join-Path $env:TEMP 'vc_redist.arm64.exe'
      $logPath = Join-Path $env:TEMP 'vc_redist_arm64_install.log'

      Write-Host "Downloading ARM64 VC++ runtime from: $url"
      Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing

      $arguments = @('/install', '/quiet', '/norestart', '/log', $logPath)
      $proc = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
      if ($proc.ExitCode -notin @(0, 3010, 1638)) {
        throw "VC++ ARM64 runtime installer failed with exit code $($proc.ExitCode). Log: $logPath"
      }

      if ($proc.ExitCode -eq 3010) {
        Write-Host 'VC++ ARM64 runtime installed; reboot is required by installer but deferred in CI.'
      } elseif ($proc.ExitCode -eq 1638) {
        Write-Host 'A newer/same VC++ ARM64 runtime is already installed.'
      } else {
        Write-Host 'VC++ ARM64 runtime installation completed successfully.'
      }

      $runtimeDlls = @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')
      foreach ($dll in $runtimeDlls) {
        $path = Join-Path "$env:WINDIR\System32" $dll
        if (-not (Test-Path $path)) {
          throw "Expected ARM64 VC runtime DLL not found: $path"
        }
        $ver = (Get-Item $path).VersionInfo.FileVersion
        Write-Host "  $dll => $path (version: $ver)"
      }

# Job-local venv so installs never pollute the agent's site-packages.
- task: PowerShell@2
  displayName: 'Create test venv'
  inputs:
    targetType: inline
    pwsh: true
    script: |
        $venvDir = "$(Agent.TempDirectory)/fl-py-venv-$(System.JobId)"
        if (Test-Path $venvDir) { Remove-Item -Recurse -Force $venvDir }
        python -m venv $venvDir
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if ($IsWindows -or $env:OS -eq 'Windows_NT') {
            $venvPy = Join-Path $venvDir 'Scripts/python.exe'
        } else {
            $venvPy = Join-Path $venvDir 'bin/python'
        }
        if (-not (Test-Path $venvPy)) { throw "venv python not found at $venvPy" }
        Write-Host "##vso[task.setvariable variable=venvPy]$venvPy"
        Write-Host "venv python: $venvPy"

- task: PowerShell@2
  displayName: 'Install built wheel + test deps'
  inputs:
    targetType: inline
    pwsh: true
    script: |
        # Locate the wheel. Each job's wheel lands in its own artifact, so a
        # single match is expected.
        $wheels = @(Get-ChildItem "${{ parameters.wheelDir }}" -Recurse -Filter '*.whl')
        if ($wheels.Count -eq 0) { throw "No .whl found under ${{ parameters.wheelDir }}" }
        if ($wheels.Count -gt 1) {
            Write-Host "Multiple wheels found:"
            $wheels | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "Expected exactly one wheel in ${{ parameters.wheelDir }}"
        }
        $wheel = $wheels[0].FullName
        Write-Host "Installing wheel: $wheel"

        & "$(venvPy)" -m pip install --upgrade pip
        & "$(venvPy)" -m pip install $wheel
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & "$(venvPy)" -c "import importlib.util; assert importlib.util.find_spec('onnxruntime'); assert importlib.util.find_spec('onnxruntime_genai_core')"
        if ($LASTEXITCODE -ne 0) {
            throw "Wheel install did not resolve universal onnxruntime / onnxruntime-genai-core dependencies"
        }
        & "$(venvPy)" -m pip install pytest pytest-cov
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

- task: PowerShell@2
  displayName: 'Run SDK tests'
  inputs:
    targetType: inline
    pwsh: true
    script: |
        Push-Location "$(Build.SourcesDirectory)/sdk_v2/python"
        try {
            # Override pythonpath = ["src"] from pyproject.toml so pytest
            # imports the installed wheel (which contains the compiled cffi
            # extension) rather than the un-built source tree (which does not).
            # The src/ entry is a local-dev convenience; in CI we want to
            # exercise exactly what we shipped.
            & "$(venvPy)" -m pytest test/ -v --override-ini=pythonpath=
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } finally {
            Pop-Location
        }
  env:
    TF_BUILD: 'true'
    FOUNDRY_TEST_DATA_DIR: ${{ parameters.testDataSharedDir }}
