# Build + test stages for the sdk_v2 C# SDK.
#
# Produces Microsoft.AI.Foundry.Local (build + test win/linux/osx). On Windows
# the native runtime it consumes bundles the reg-free WinML 2.x runtime, so a
# single package serves every platform.
#
# Depends on the native pack stage from stages-build-native.yml:
#   cpp_pack_nuget  (artifact: cpp-nuget)
#
# Produces a `cs-sdk-v2` pipeline artifact containing the signed .nupkg (+ .snupkg).

stages:

# ====================================================================
# Build stage — produces the C# SDK NuGet package.
# ====================================================================
- stage: cs_build
  displayName: 'C# SDK: Build'
  dependsOn:
  - compute_version
  - cpp_pack_nuget
  jobs:
  - job: build
    pool:
      name: onnxruntime-Win-CPU-2022
      os: windows
    templateContext:
      inputs:
      - input: pipelineArtifact
        artifactName: 'version-info'
        targetPath: '$(Pipeline.Workspace)/version-info'
      - input: pipelineArtifact
        artifactName: 'cpp-nuget'
        targetPath: '$(Pipeline.Workspace)/cpp-nuget'
      outputs:
      - output: pipelineArtifact
        artifactName: 'cs-sdk-v2'
        targetPath: '$(Build.ArtifactStagingDirectory)/cs-sdk'
    steps:
    - checkout: self
      clean: true
    - template: steps-build-cs.yml
      parameters:
        flNugetDir: '$(Pipeline.Workspace)/cpp-nuget'
        outputDir: '$(Build.ArtifactStagingDirectory)/cs-sdk'

# ====================================================================
# Test — Windows x64
# ====================================================================
- stage: cs_test_win_x64
  displayName: 'C# SDK: Test Windows x64'
  dependsOn:
  - cs_build
  jobs:
  - job: test
    pool:
      name: onnxruntime-Win-CPU-2022
      os: windows
    templateContext:
      inputs:
      - input: pipelineArtifact
        artifactName: 'version-info'
        targetPath: '$(Pipeline.Workspace)/version-info'
      - input: pipelineArtifact
        artifactName: 'cpp-nuget'
        targetPath: '$(Pipeline.Workspace)/cpp-nuget'
    steps:
    - checkout: self
      clean: true
    - template: ../../templates/fetch-test-data-from-blob.yml@self
      parameters:
        scriptType: ps
        installAzCli: true
    - template: steps-test-cs.yml
      parameters:
        flNugetDir: '$(Pipeline.Workspace)/cpp-nuget'
        testDataSharedDir: '$(Build.SourcesDirectory)/test-data-shared'
        usePwsh: false

- stage: cs_test_win_arm64
  displayName: 'C# SDK: Test Windows ARM64'
  dependsOn:
  - cs_build
  jobs:
  - job: test
    pool:
      name: onnxruntime-native-arm64-16core
      os: windows
      hostArchitecture: arm64
    templateContext:
      inputs:
      - input: pipelineArtifact
        artifactName: 'version-info'
        targetPath: '$(Pipeline.Workspace)/version-info'
      - input: pipelineArtifact
        artifactName: 'cpp-nuget'
        targetPath: '$(Pipeline.Workspace)/cpp-nuget'
    steps:
    - checkout: self
      clean: true
    - template: ../../templates/fetch-test-data-from-blob.yml@self
      parameters:
        scriptType: ps
        installAzCli: true
    - template: steps-test-cs.yml
      parameters:
        flNugetDir: '$(Pipeline.Workspace)/cpp-nuget'
        testDataSharedDir: '$(Build.SourcesDirectory)/test-data-shared'
        usePwsh: false

# ====================================================================
# Test — Linux x64
# ====================================================================
- stage: cs_test_linux_x64
  displayName: 'C# SDK: Test Linux x64'
  dependsOn:
  - cs_build
  jobs:
  - job: test
    pool:
      name: onnxruntime-Ubuntu2404-AMD-CPU
      os: linux
    templateContext:
      inputs:
      - input: pipelineArtifact
        artifactName: 'version-info'
        targetPath: '$(Pipeline.Workspace)/version-info'
      - input: pipelineArtifact
        artifactName: 'cpp-nuget'
        targetPath: '$(Pipeline.Workspace)/cpp-nuget'
    steps:
    - checkout: self
      clean: true
    - template: ../../templates/fetch-test-data-from-blob.yml@self
    - template: steps-test-cs.yml
      parameters:
        flNugetDir: '$(Pipeline.Workspace)/cpp-nuget'
        testDataSharedDir: '$(Build.SourcesDirectory)/test-data-shared'

# ====================================================================
# Test — Linux ARM64
# ====================================================================
- stage: cs_test_linux_arm64
  displayName: 'C# SDK: Test Linux ARM64'
  dependsOn:
  - cs_build
  jobs:
  - job: test
    pool:
      name: onnxruntime-linux-ARM64-CPU-2019
      os: linux
      hostArchitecture: arm64
    templateContext:
      inputs:
      - input: pipelineArtifact
        artifactName: 'version-info'
        targetPath: '$(Pipeline.Workspace)/version-info'
      - input: pipelineArtifact
        artifactName: 'cpp-nuget'
        targetPath: '$(Pipeline.Workspace)/cpp-nuget'
    steps:
    - checkout: self
      clean: true
    - template: ../../templates/fetch-test-data-from-blob.yml@self
    - template: steps-test-cs.yml
      parameters:
        flNugetDir: '$(Pipeline.Workspace)/cpp-nuget'
        testDataSharedDir: '$(Build.SourcesDirectory)/test-data-shared'

# ====================================================================
# Test — macOS ARM64
# ====================================================================
- stage: cs_test_osx_arm64
  displayName: 'C# SDK: Test macOS ARM64'
  dependsOn:
  - cs_build
  jobs:
  - job: test
    pool:
      name: AcesShared
      os: macOS
      demands:
      - ImageOverride -equals ACES_VM_SharedPool_Sequoia
    templateContext:
      inputs:
      - input: pipelineArtifact
        artifactName: 'version-info'
        targetPath: '$(Pipeline.Workspace)/version-info'
      - input: pipelineArtifact
        artifactName: 'cpp-nuget'
        targetPath: '$(Pipeline.Workspace)/cpp-nuget'
    steps:
    - checkout: self
      clean: true
    - template: ../../templates/fetch-test-data-from-blob.yml@self
    - template: steps-test-cs.yml
      parameters:
        flNugetDir: '$(Pipeline.Workspace)/cpp-nuget'
        testDataSharedDir: '$(Build.SourcesDirectory)/test-data-shared'
        additionalTestArgs: '--settings $(Build.SourcesDirectory)/sdk_v2/cs/test/FoundryLocal.Tests/sequential.runsettings'

# ====================================================================
# Package test — restore the published NuGet packages as a consumer
# ====================================================================
- stage: cs_package_test
  displayName: 'C# SDK: Test packaged NuGet'
  dependsOn:
  - cs_build
  jobs:
  - job: test
    pool:
      name: onnxruntime-Win-CPU-2022
      os: windows
    templateContext:
      inputs:
      - input: pipelineArtifact
        artifactName: 'version-info'
        targetPath: '$(Pipeline.Workspace)/version-info'
      - input: pipelineArtifact
        artifactName: 'cpp-nuget'
        targetPath: '$(Pipeline.Workspace)/cpp-nuget'
      - input: pipelineArtifact
        artifactName: 'cs-sdk-v2'
        targetPath: '$(Pipeline.Workspace)/cs-sdk-v2'
    steps:
    - checkout: self
      clean: true
    - task: UseDotNet@2
      displayName: 'Use .NET 10 SDK'
      inputs:
        packageType: sdk
        version: '10.0.x'
    - task: UseDotNet@2
      displayName: 'Install .NET 9 runtime'
      inputs:
        packageType: runtime
        version: '9.0.x'
    - task: NuGetAuthenticate@1
      displayName: 'Authenticate NuGet feeds'
    - task: PowerShell@2
      displayName: 'Run packaged C# basic chat sample'
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'

          $consumerDir = Join-Path '$(Agent.TempDirectory)' 'cs-sdk-package-test'
          $feedDir = Join-Path $consumerDir 'feed'
          if (Test-Path $consumerDir) { Remove-Item -Recurse -Force $consumerDir }
          New-Item -ItemType Directory -Force -Path $feedDir | Out-Null

          $packages = @(
            Get-ChildItem '$(Pipeline.Workspace)/cpp-nuget' -Recurse -Filter '*.nupkg' |
              Where-Object { $_.Name -notlike '*.snupkg' } | Select-Object -First 1
            Get-ChildItem '$(Pipeline.Workspace)/cs-sdk-v2' -Recurse -Filter '*.nupkg' |
              Where-Object { $_.Name -notlike '*.snupkg' } | Select-Object -First 1
          )
          if ($packages.Count -ne 2 -or $packages -contains $null) {
            throw 'Expected both runtime and C# SDK NuGet packages'
          }
          $packages | ForEach-Object { Copy-Item $_.FullName -Destination $feedDir -Force }

          $version = (Get-Content '$(Pipeline.Workspace)/version-info/sdkVersion.txt' -Raw).Trim()
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="LocalPackages" value="$feedDir" />
              <add key="AIFoundryLocal_PublicPackages" value="https://pkgs.dev.azure.com/aiinfra/AIFoundryLocal/_packaging/AIFoundryLocal_PublicPackages/nuget/v3/index.json" />
            </packageSources>
          </configuration>
          "@ | Set-Content (Join-Path $consumerDir 'NuGet.config')

          $project = '$(Build.SourcesDirectory)/sdk_v2/cs/examples/BasicChat/BasicChat.csproj'
          if (Test-Path $env:FOUNDRY_LOCAL_SAMPLE_CACHE_DIR) {
            Remove-Item $env:FOUNDRY_LOCAL_SAMPLE_CACHE_DIR -Recurse -Force
          }
          dotnet restore $project `
            --configfile (Join-Path $consumerDir 'NuGet.config') `
            --runtime win-x64 `
            /p:FoundryLocalPackageVersion=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project $project --no-restore --runtime win-x64 `
            /p:FoundryLocalPackageVersion=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      env:
        FOUNDRY_LOCAL_SAMPLE_CACHE_DIR: '$(Agent.TempDirectory)/cs-package-model-cache'
