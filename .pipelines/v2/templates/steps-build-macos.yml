# Reusable macOS build steps for the Foundry Local C++ SDK.
#
# Pool: AcesShared (Sequoia, Apple Silicon). Builds and tests natively.

parameters:
- name: buildConfig
  type: string
- name: ortVersion
  type: string
- name: genaiVersion
  type: string
- name: runTests
  type: boolean
  default: false
- name: isRelease
  type: boolean

steps:

- bash: |
    set -euo pipefail
    git clone https://github.com/microsoft/vcpkg.git "$(Build.BinariesDirectory)/vcpkg"
    "$(Build.BinariesDirectory)/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
  displayName: 'Bootstrap vcpkg'

- bash: |
    set -euo pipefail
    # Most macOS images include cmake/ninja; install via brew if missing.
    if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
    if ! command -v ninja >/dev/null 2>&1; then brew install ninja; fi
    if ! command -v pkg-config >/dev/null 2>&1; then brew install pkg-config; fi
    cmake --version
    ninja --version
    pkg-config --version
  displayName: 'Verify build tools'

- template: steps-prefetch-nuget.yml
  parameters:
    ortVersion: ${{ parameters.ortVersion }}
    genaiVersion: ${{ parameters.genaiVersion }}
    winmlVersion: ''
    includeWinml: false
    shell: bash

# Bake the pipeline-computed version into the binary so FoundryLocalGetVersionString()
# matches the .nupkg version instead of the cmake default.
- bash: |
    set -euo pipefail
    version=$(cat "$(Pipeline.Workspace)/version-info/sdkVersion.txt" | tr -d '[:space:]')
    defines="$(cmakeFetchDefines) \"FOUNDRY_LOCAL_VERSION_STRING=$version\""
    echo "##vso[task.setvariable variable=cmakeFetchDefines]$defines"
    echo "cmakeFetchDefines = $defines"
  displayName: 'Append version define'

- ${{ if eq(parameters.runTests, true) }}:
  - template: ../../templates/fetch-models-from-artifacts-feed.yml@self
    parameters:
      destinationPath: '$(Agent.BuildDirectory)/test-data-shared'

- bash: |
    set -euo pipefail
    python3 build.py --configure --build \
      --config ${{ parameters.buildConfig }} \
      --cmake_extra_defines $(cmakeFetchDefines)
  displayName: 'Configure and build'
  workingDirectory: $(Build.SourcesDirectory)/sdk_v2/cpp
  env:
    VCPKG_ROOT: $(Build.BinariesDirectory)/vcpkg

- ${{ if eq(parameters.runTests, true) }}:
  - bash: |
      set -euo pipefail
      python3 build.py --test --config ${{ parameters.buildConfig }}
    displayName: 'Run tests'
    workingDirectory: $(Build.SourcesDirectory)/sdk_v2/cpp
    env:
      VCPKG_ROOT: $(Build.BinariesDirectory)/vcpkg
      FOUNDRY_TEST_DATA_DIR: $(Agent.BuildDirectory)/test-data-shared

- bash: |
    echo "=== vcpkg buildtrees error logs ==="
    find "$(Build.BinariesDirectory)/vcpkg/buildtrees" -name "*err.log" -exec echo "--- {} ---" \; -exec cat {} \; || true
  displayName: 'Dump vcpkg error logs'
  condition: failed()

# Stage the native build artifacts. The C++ SDK bundle consumes the co-located
# ORT/GenAI libraries directly. Python wheel staging filters them out because
# its pip dependencies provide and preload those libraries.
- bash: |
    set -euo pipefail
    src='$(Build.SourcesDirectory)/sdk_v2/cpp/build/macOS/${{ parameters.buildConfig }}/bin'
    dst='$(Build.ArtifactStagingDirectory)/native'
    mkdir -p "$dst"

    primary="$src/libfoundry_local.dylib"
    if [ ! -f "$primary" ]; then
      echo "ERROR: libfoundry_local.dylib not found at $primary" >&2
      exit 1
    fi
    cp -P "$primary" "$dst/"
    echo "  staged libfoundry_local.dylib"

    for required in libonnxruntime.dylib libonnxruntime-genai.dylib; do
      if [ ! -e "$src/$required" ]; then
        echo "ERROR: $required not found at $src/$required" >&2
        exit 1
      fi
    done
    for runtime in "$src"/libonnxruntime*.dylib; do
      if [ -e "$runtime" ]; then
        cp -P "$runtime" "$dst/"
        echo "  staged $(basename "$runtime")"
      fi
    done

  displayName: 'Stage native artifacts'

- ${{ if eq(parameters.isRelease, true) }}:
  - bash: |
      set -euo pipefail
      rm -f libfoundry_local_dylib.zip
      zip libfoundry_local_dylib.zip libfoundry_local.dylib
    displayName: 'Zip libfoundry_local.dylib for signing'
    workingDirectory: '$(Build.ArtifactStagingDirectory)/native'

  # ESRP requires a ZIP or DMG transport for macOS signing. The C++ SDK archive,
  # runtime NuGet/C# SDK, Python wheel, and JS prebuild all consume the signed
  # staged dylib restored from this archive.
  - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
    displayName: 'Sign libfoundry_local.dylib ZIP'
    inputs:
      ConnectedServiceName: 'OnnxrunTimeCodeSign_20240611'
      UseMSIAuthentication: true
      AppRegistrationClientId: '$(esrpClientId)'
      AppRegistrationTenantId: '$(esrpTenantId)'
      EsrpClientId: '$(esrpClientId)'
      AuthAKVName: '$(esrpAkvName)'
      AuthSignCertName: '$(esrpSignCertName)'
      FolderPath: '$(Build.ArtifactStagingDirectory)/native'
      Pattern: 'libfoundry_local_dylib.zip'
      SessionTimeout: 90
      ServiceEndpointUrl: 'https://api.esrp.microsoft.com/api/v2'
      MaxConcurrency: 25
      signConfigType: inlineSignParams
      inlineOperation: |
        [{"keyCode":"CP-401337-Apple","operationSetCode":"MacAppDeveloperSign","parameters":[{"parameterName":"Hardening","parameterValue":"--options=runtime"}],"toolName":"sign","toolVersion":"6.2.9304.0"}]

  - bash: |
      set -euo pipefail
      unzip -o libfoundry_local_dylib.zip
      rm -- libfoundry_local_dylib.zip
    displayName: 'Extract signed libfoundry_local.dylib'
    workingDirectory: '$(Build.ArtifactStagingDirectory)/native'

  - bash: |
      set -euo pipefail
      dylib='$(Build.ArtifactStagingDirectory)/native/libfoundry_local.dylib'
      codesign --verify --strict --verbose=2 "$dylib"
      signature=$(codesign --display --verbose=4 "$dylib" 2>&1)
      echo "$signature"
      grep -q '^Authority=Developer ID Application:' <<<"$signature"
      grep -Eq '^CodeDirectory .*flags=.*\(.*runtime.*\)' <<<"$signature"
      grep -q '^Timestamp=' <<<"$signature"
    displayName: 'Verify libfoundry_local.dylib signature'

# Stage debug symbols into a separate artifact so they can be published
# independently without being bundled into the Python wheel (which consumes
# the native artifact wholesale and must not contain the .dSYM bundle;
# the bundle is a directory whose inner DWARF file shares the name
# libfoundry_local.dylib and would corrupt the wheel if copied flat).
- bash: |
    set -euo pipefail
    src='$(Build.SourcesDirectory)/sdk_v2/cpp/build/macOS/${{ parameters.buildConfig }}/bin'
    dst='$(Build.ArtifactStagingDirectory)/symbols'
    mkdir -p "$dst"

    dsym="$src/libfoundry_local.dylib.dSYM"
    if [ -d "$dsym" ]; then
      cp -r "$dsym" "$dst/"
      echo "  staged libfoundry_local.dylib.dSYM"
    fi
  displayName: 'Stage debug symbol artifacts'
