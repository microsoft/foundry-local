# Install pinned Maven and configure the authenticated Lotus upstream mirror.

steps:
# TODO: Add this into the image
- task: UniversalPackages@0
  displayName: 'Download Maven'
  inputs:
    command: download
    feedsToUse: internal
    vstsFeed: 'Lotus'
    vstsFeedPackage: 'maven-zip'
    vstsPackageVersion: '3.9.9'
    downloadDirectory: '$(Agent.TempDirectory)/foundry-java-tools'

- task: PowerShell@2
  displayName: 'Bootstrap Maven 3.9.9'
  inputs:
    targetType: inline
    pwsh: true
    script: |
      $ErrorActionPreference = 'Stop'

      $version = '3.9.9'
      $tools = Join-Path '$(Agent.TempDirectory)' 'foundry-java-tools'
      $archive = Join-Path $tools "apache-maven-$version-bin.zip"
      $mavenHome = Join-Path $tools "apache-maven-$version"
      $mavenCommand = if ($IsWindows) { 'bin/mvn.cmd' } else { 'bin/mvn' }
      $maven = Join-Path $mavenHome $mavenCommand

      if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
        throw "Unable to find Maven archive: $archive"
      }

      $expected = '8beac8d11ef208f1e2a8df0682b9448a9a363d2ad13ca74af43705549e72e74' +
        'c9378823bf689287801cbbfc2f6ea9596201d19ccacfdfb682ee8a2ff4c4418ba'
      if ((Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash -ne $expected) {
        throw 'Maven archive checksum mismatch.'
      }
      Expand-Archive -LiteralPath $archive -DestinationPath $tools -Force

      if (-not $IsWindows) {
        & chmod u+x $maven
        if ($LASTEXITCODE -ne 0) {
          throw "Could not make Maven executable: $maven"
        }
      }

      $settings = Join-Path $tools 'settings.xml'
      @'
      <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
        <servers>
          <server>
            <id>Lotus</id>
            <username>AzureDevOps</username>
            <password>${env.SYSTEM_ACCESSTOKEN}</password>
          </server>
        </servers>
        <mirrors>
          <mirror>
            <id>Lotus</id>
            <url>https://pkgs.dev.azure.com/aiinfra/_packaging/Lotus/maven/v1</url>
            <mirrorOf>*</mirrorOf>
          </mirror>
        </mirrors>
      </settings>
      '@ | Set-Content -LiteralPath $settings -Encoding utf8

      Write-Host "##vso[task.setvariable variable=foundryMavenHome]$mavenHome"
      Write-Host "##vso[task.setvariable variable=foundryMavenSettings]$settings"
      Write-Host "##vso[task.prependpath]$(Join-Path $mavenHome 'bin')"

- script: |
    echo "Verifying Maven installation..."
    mvn --version
  displayName: 'Verify Maven Version'
  env:
    JAVA_HOME: $(foundryJavaHome)
